name: Check launch schedule

on:
  schedule:
    # Runs at the top of every hour. GitHub's free scheduled Actions can
    # lag a few minutes during busy periods, but that's fine for this.
    - cron: "0 * * * *"
  workflow_dispatch: {}  # lets you click "Run workflow" manually to test

permissions:
  contents: write  # needed so the workflow can commit the updated state file

concurrency:
  group: check-launches
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notifier
        run: python notifier.py

      - name: Commit updated state (if changed)
        run: |
          git config user.name "launch-notifier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json docs/launches.json
          git diff --cached --quiet || git commit -m "Update launch state [skip ci]"
          git push

name: Check launch schedule

on:
  schedule:
    # Run once every hour, at 7 minutes past the hour.
    # Using :07 instead of exactly :00 can reduce GitHub Actions congestion.
    - cron: "7 * * * *"

  # Also lets you manually test it from the Actions tab.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-launches
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run notifier
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notifier.py

      - name: Commit updated state
        run: |
          git config user.name "launch-notifier-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/state.json docs/launches.json

          if git diff --cached --quiet; then
            echo "No launch data changes to commit."
          else
            git commit -m "Update launch state [skip ci]"
          fi

          git pull --rebase --autostash origin main
          git push

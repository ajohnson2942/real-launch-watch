name: Check launch schedule

on:
  schedule:
    # Run once every hour, at 7 minutes past the hour.
    # Using :07 instead of exactly :00 can reduce GitHub Actions congestion.
    - cron: "7 * * * *"

  # Also lets you manually test it from the Actions tab.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-launches
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write web push config
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          app_id = os.environ.get("ONESIGNAL_APP_ID", "").strip()
          api_key = os.environ.get("ONESIGNAL_REST_API_KEY", "").strip()
          public_app_id = app_id if app_id and api_key else ""

          Path("docs/push-config.js").write_text(
              "window.WAL_PUSH_CONFIG = "
              + json.dumps({"oneSignalAppId": public_app_id})
              + ";\n",
              encoding="utf-8",
          )
          PY

      - name: Run notifier
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: python notifier_v150.py

      - name: Commit updated state
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          git config user.name "launch-notifier-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/state.json docs/launches.json docs/push-config.js

          if git diff --cached --quiet; then
            echo "No launch data changes to commit."
          else
            git commit -m "Update launch state [skip ci]"
          fi

          git pull --rebase --autostash origin main
          git push

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Tracked Launch - Watch-A-Launch</title>
<meta name="theme-color" content="#151B54">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="launch-photo.png" type="image/png">
<link rel="apple-touch-icon" href="launch-photo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=Orbitron:wght@500;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Work+Sans:wght@400;500;600&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg-top:#151B54;--bg-bottom:#d16002;--panel:#121A30;--panel-2:#182242;--hairline:#3a3160;--text:#F3F1FA;--muted:#C9C3E0;--accent:#ffb37a;--purple:#c9a7ff;--red:#ff3b3b}
*{box-sizing:border-box}html,body{margin:0;padding:0}html{min-height:100%;background:#151B54}body{min-height:100vh;color:var(--text);background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bottom) 100%);font-family:'Work Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}.page{max-width:760px;margin:0 auto;padding:1.15rem 1.5rem 4rem}.topbar{display:flex;align-items:center;min-height:44px}.back{display:inline-flex;align-items:center;gap:.45rem;padding:.55rem .75rem;border:1px solid var(--hairline);border-radius:8px;color:var(--text);background:rgba(18,26,48,.78);font-family:'JetBrains Mono',monospace;font-size:.78rem;text-decoration:none;transition:box-shadow .2s ease,border-color .2s ease,transform .2s ease}.back:hover,.back:focus-visible{border-color:var(--purple);box-shadow:0 0 16px rgba(201,167,255,.55);outline:none}.back:active{transform:translateY(1px)}h1{margin:1.4rem 0 .35rem;font-family:'EB Garamond',Garamond,Georgia,serif;font-size:clamp(2.4rem,9vw,4rem);font-weight:600;line-height:1}.subtitle{margin:0 0 1.25rem;color:var(--accent);font-family:'Orbitron',sans-serif;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase}.panel{border:1px solid var(--hairline);border-radius:14px;background:linear-gradient(160deg,var(--panel-2),var(--panel));box-shadow:0 10px 28px rgba(0,0,0,.15)}.countdown-panel{padding:1.25rem 1.3rem;margin-bottom:1rem}.label{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}.clock{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.45rem;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:clamp(1.7rem,9vw,2.8rem);font-weight:700;letter-spacing:.02em}.clock .unit{color:var(--accent)}.clock small{display:block;margin-top:.15em;color:var(--muted);font-family:'Work Sans',sans-serif;font-size:.3em;font-weight:500;letter-spacing:.08em;text-transform:uppercase}.details{padding:1.25rem 1.3rem;margin-bottom:1rem}.mission{margin:.25rem 0 .85rem;font-family:'Barlow Condensed',sans-serif;font-size:clamp(1.55rem,6vw,2.1rem);font-weight:700;line-height:1.12}.detail-row{display:grid;grid-template-columns:82px minmax(0,1fr);gap:.75rem;padding:.55rem 0;border-top:1px solid rgba(201,195,224,.16)}.detail-row:first-of-type{border-top:0}.detail-key{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.7rem;text-transform:uppercase}.detail-value{color:var(--text);font-family:'Lora',serif;font-size:.98rem;line-height:1.45}.map-panel{padding:1.05rem}.map-title{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:0 0 .7rem;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}.map-note{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.62rem;text-align:right}.map-wrap{position:relative;overflow:hidden;border:1px solid rgba(201,195,224,.22);border-radius:11px;background:#0d1530}.us-map{display:block;width:100%;height:auto;aspect-ratio:9/5;background:#0d1530}.us-outline{fill:#eeeae2;stroke:#c9c3e0;stroke-width:2.2;vector-effect:non-scaling-stroke}.map-grid{stroke:rgba(201,195,224,.12);stroke-width:1;vector-effect:non-scaling-stroke}.ocean-label{fill:rgba(201,195,224,.36);font-family:'JetBrains Mono',monospace;font-size:17px;letter-spacing:.14em}.pin-shadow{fill:rgba(255,59,59,.22)}.pin-body{fill:var(--red);stroke:#fff;stroke-width:3;vector-effect:non-scaling-stroke}.pin-core{fill:#fff}.pin-label-bg{fill:rgba(18,26,48,.92);stroke:#c9a7ff;stroke-width:1.4;vector-effect:non-scaling-stroke}.pin-label{fill:#fff;font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;letter-spacing:.04em}.map-empty{padding:1.3rem;color:var(--muted);font-family:'Lora',serif;line-height:1.55}.empty{padding:1.4rem;color:var(--muted);font-family:'Lora',serif;line-height:1.55}@media(max-width:520px){.page{padding-left:1rem;padding-right:1rem}.countdown-panel,.details{padding:1rem}.detail-row{grid-template-columns:70px minmax(0,1fr);gap:.55rem}.map-title{align-items:flex-start;flex-direction:column;gap:.25rem}.map-note{text-align:left}.pin-label{font-size:20px}}
</style>
</head>
<body>
<main class="page">
  <div class="topbar"><a class="back" href="index.html" aria-label="Back to Watch-A-Launch">← Back</a></div>
  <h1>Next Tracked Launch</h1>
  <p class="subtitle">Watch-A-Launch</p>

  <section class="panel countdown-panel" aria-label="Countdown to next launch">
    <div class="label">Countdown to liftoff</div>
    <div class="clock" id="countdownClock">Loading…</div>
  </section>

  <section class="panel details" id="launchDetails" aria-live="polite">
    <div class="empty">Loading the next tracked launch…</div>
  </section>

  <section class="panel map-panel">
    <div class="map-title"><span>Launch Location</span><span class="map-note" id="mapLocationLabel">Loading…</span></div>
    <div class="map-wrap" id="mapWrap">
      <svg class="us-map" id="usMap" viewBox="0 0 900 500" role="img" aria-label="Map of the continental United States showing the next launch location">
        <rect x="0" y="0" width="900" height="500" fill="#0d1530"></rect>
        <g aria-hidden="true">
          <line class="map-grid" x1="40" y1="145" x2="860" y2="145"></line>
          <line class="map-grid" x1="40" y1="250" x2="860" y2="250"></line>
          <line class="map-grid" x1="40" y1="355" x2="860" y2="355"></line>
          <line class="map-grid" x1="245" y1="40" x2="245" y2="460"></line>
          <line class="map-grid" x1="450" y1="40" x2="450" y2="460"></line>
          <line class="map-grid" x1="655" y1="40" x2="655" y2="460"></line>
        </g>
        <polygon class="us-outline" id="usOutline" points=""></polygon>
        <text class="ocean-label" x="58" y="250">PACIFIC</text>
        <text class="ocean-label" x="750" y="250">ATLANTIC</text>
        <g id="launchPin" style="display:none">
          <circle class="pin-shadow" cx="0" cy="0" r="28"></circle>
          <path class="pin-body" d="M0,-27 C-16,-27 -27,-16 -27,0 C-27,19 0,43 0,43 C0,43 27,19 27,0 C27,-16 16,-27 0,-27 Z"></path>
          <circle class="pin-core" cx="0" cy="0" r="8"></circle>
          <g id="pinLabelGroup" transform="translate(34,-24)">
            <rect class="pin-label-bg" id="pinLabelBg" x="0" y="0" width="210" height="40" rx="8"></rect>
            <text class="pin-label" id="pinLabel" x="12" y="26">LAUNCH SITE</text>
          </g>
        </g>
      </svg>
      <div class="map-empty" id="mapEmpty" style="display:none">The launch location could not be placed on the map, but the launch site is still listed above.</div>
    </div>
  </section>
</main>
<script>
const FEED_URL='launches.json';
let launchFeed=[];
let activeLaunch=null;
let countdownTimer=null;
let advanceQueued=false;

const US_OUTLINE=[
  [-124.7,48.5],[-124.3,46.2],[-124.2,43.7],[-123.8,41.9],[-122.8,39.0],[-121.2,36.7],[-119.7,34.8],[-117.1,32.5],
  [-114.7,32.7],[-111.0,31.3],[-109.1,31.3],[-106.5,31.8],[-104.5,29.8],[-102.8,29.0],[-100.1,28.9],[-98.0,26.4],
  [-97.0,25.8],[-96.0,27.8],[-94.0,29.5],[-91.0,29.0],[-89.0,29.1],[-87.6,30.3],[-85.0,29.8],[-83.0,28.7],
  [-81.2,25.4],[-80.1,25.3],[-80.0,27.8],[-81.2,30.8],[-80.2,32.0],[-79.3,33.3],[-78.0,34.7],[-77.0,35.5],
  [-76.0,36.5],[-75.5,38.2],[-74.2,40.5],[-72.0,41.2],[-70.0,42.8],[-69.0,45.0],[-71.0,47.0],[-73.5,45.0],
  [-76.0,44.5],[-79.0,43.0],[-82.0,42.0],[-83.3,43.7],[-84.0,46.0],[-88.5,47.9],[-95.0,49.0],[-104.0,49.0],
  [-111.0,49.0],[-117.0,49.0],[-124.7,48.5]
];

function parseDate(value){if(!value)return null;const date=new Date(value);return Number.isNaN(date.getTime())?null:date;}
function escapeHtml(value){return String(value??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}
function pad(number){return String(number).padStart(2,'0');}
function nextExactLaunch(){const now=new Date();return launchFeed.filter(launch=>{const date=parseDate(launch.launch_time_utc);return date&&date>now;}).sort((a,b)=>parseDate(a.launch_time_utc)-parseDate(b.launch_time_utc))[0]||null;}
function timeZoneForLaunch(launch){const site=String(launch.site||'').toLowerCase();if(site.includes('starbase')||site.includes('boca chica')||site.includes(', tx,'))return'America/Chicago';if(launch.location_code==='FL'||site.includes('cape canaveral')||site.includes('kennedy'))return'America/New_York';return'America/Los_Angeles';}
function formatLaunchTime(launch){const date=parseDate(launch.launch_time_utc);if(!date)return launch.time_description||'Exact launch time TBD';return new Intl.DateTimeFormat('en-US',{timeZone:timeZoneForLaunch(launch),weekday:'long',month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(date);}
function launchCoordinates(launch){const site=String(launch.site||'').toLowerCase();if(site.includes('vandenberg'))return{lat:34.742,lon:-120.572,label:'Vandenberg Space Force Base, California',short:'VANDENBERG'};if(site.includes('cape canaveral')||site.includes('kennedy'))return{lat:28.4889,lon:-80.5778,label:'Cape Canaveral / Kennedy Space Center, Florida',short:'CAPE CANAVERAL'};if(site.includes('starbase')||site.includes('boca chica')||site.includes(', tx,'))return{lat:25.997,lon:-97.156,label:'SpaceX Starbase, Texas',short:'STARBASE'};if(launch.location_code==='CA')return{lat:34.742,lon:-120.572,label:'Vandenberg Space Force Base, California',short:'VANDENBERG'};if(launch.location_code==='FL')return{lat:28.4889,lon:-80.5778,label:'Cape Canaveral / Kennedy Space Center, Florida',short:'CAPE CANAVERAL'};return null;}
function formatClock(ms){if(ms<=0)return'<span class="unit">LIFTOFF WINDOW OPEN</span>';const total=Math.floor(ms/1000);const days=Math.floor(total/86400);const hours=Math.floor((total%86400)/3600);const mins=Math.floor((total%3600)/60);const secs=total%60;return`<span><span class="unit">${days}</span><small>days</small></span><span><span class="unit">${pad(hours)}</span><small>hrs</small></span><span><span class="unit">${pad(mins)}</span><small>min</small></span><span><span class="unit">${pad(secs)}</span><small>sec</small></span>`;}
function project(lon,lat){const x=40+((lon+125)/59)*820;const y=40+((50-lat)/26)*420;return{x,y};}
function drawOutline(){const outline=document.getElementById('usOutline');outline.setAttribute('points',US_OUTLINE.map(([lon,lat])=>{const p=project(lon,lat);return`${p.x.toFixed(1)},${p.y.toFixed(1)}`;}).join(' '));}
function updateCountdown(){const clock=document.getElementById('countdownClock');if(!activeLaunch){clock.textContent='No exact launch time available';return;}const date=parseDate(activeLaunch.launch_time_utc);if(!date){clock.textContent='Exact time TBD';return;}const remaining=date-new Date();clock.innerHTML=formatClock(remaining);if(remaining<=0&&!advanceQueued){advanceQueued=true;setTimeout(()=>{advanceQueued=false;loadFeed();},2500);}}
function renderDetails(){const details=document.getElementById('launchDetails');if(!activeLaunch){details.innerHTML='<div class="empty">There is not currently an upcoming tracked launch with an exact liftoff time.</div>';return;}details.innerHTML=`<div class="label">Next launch</div><div class="mission">${escapeHtml(activeLaunch.rocket)} &middot; ${escapeHtml(activeLaunch.mission)}</div><div class="detail-row"><div class="detail-key">When</div><div class="detail-value">${escapeHtml(formatLaunchTime(activeLaunch))}</div></div><div class="detail-row"><div class="detail-key">Where</div><div class="detail-value">${escapeHtml(activeLaunch.site||'Launch site unavailable')}</div></div>`;}
function renderMap(){const label=document.getElementById('mapLocationLabel');const pin=document.getElementById('launchPin');const mapEmpty=document.getElementById('mapEmpty');const svg=document.getElementById('usMap');const coords=activeLaunch?launchCoordinates(activeLaunch):null;if(!coords){label.textContent='Location unavailable';pin.style.display='none';mapEmpty.style.display='block';svg.style.display='none';return;}svg.style.display='block';mapEmpty.style.display='none';label.textContent=coords.label;const p=project(coords.lon,coords.lat);pin.setAttribute('transform',`translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})`);pin.style.display='block';const text=document.getElementById('pinLabel');const bg=document.getElementById('pinLabelBg');text.textContent=coords.short;const width=Math.max(145,coords.short.length*11+24);bg.setAttribute('width',String(width));const labelGroup=document.getElementById('pinLabelGroup');if(p.x>650){labelGroup.setAttribute('transform',`translate(${-width-34},-24)`);}else{labelGroup.setAttribute('transform','translate(34,-24)');}}
function renderPage(){activeLaunch=nextExactLaunch();renderDetails();renderMap();updateCountdown();if(countdownTimer)clearInterval(countdownTimer);countdownTimer=setInterval(updateCountdown,1000);}
function loadFeed(){fetch(`${FEED_URL}?t=${Date.now()}`,{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json();}).then(data=>{launchFeed=Array.isArray(data.launches)?data.launches:[];renderPage();}).catch(error=>{document.getElementById('launchDetails').innerHTML='<div class="empty">Could not load the next launch right now.</div>';document.getElementById('countdownClock').textContent='Unavailable';document.getElementById('mapLocationLabel').textContent='Unavailable';console.error(error);});}

drawOutline();
loadFeed();
setInterval(loadFeed,60*60*1000);
</script>
</body>
</html>

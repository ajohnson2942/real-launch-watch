<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Tracked Launch - Watch-A-Launch</title>
<meta name="theme-color" content="#151B54">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="launch-photo.png" type="image/png">
<link rel="apple-touch-icon" href="launch-photo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=Orbitron:wght@500;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Work+Sans:wght@400;500;600&family=Lora:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg-top:#151B54;--bg-bottom:#d16002;--panel:#121A30;--panel-2:#182242;--hairline:#3a3160;--text:#F3F1FA;--muted:#C9C3E0;--accent:#ffb37a;--purple:#c9a7ff}
*{box-sizing:border-box}html,body{margin:0;padding:0}html{min-height:100%;background:#151B54}body{min-height:100vh;color:var(--text);background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bottom) 100%);font-family:'Work Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}.page{max-width:760px;margin:0 auto;padding:1.15rem 1.5rem 4rem}.topbar{display:flex;align-items:center;min-height:44px}.back{display:inline-flex;align-items:center;gap:.45rem;padding:.55rem .75rem;border:1px solid var(--hairline);border-radius:8px;color:var(--text);background:rgba(18,26,48,.78);font-family:'JetBrains Mono',monospace;font-size:.78rem;text-decoration:none;transition:box-shadow .2s ease,border-color .2s ease,transform .2s ease}.back:hover,.back:focus-visible{border-color:var(--purple);box-shadow:0 0 16px rgba(201,167,255,.55);outline:none}.back:active{transform:translateY(1px)}h1{margin:1.4rem 0 .35rem;font-family:'EB Garamond',Garamond,Georgia,serif;font-size:clamp(2.4rem,9vw,4rem);font-weight:600;line-height:1}.subtitle{margin:0 0 1.25rem;color:var(--accent);font-family:'Orbitron',sans-serif;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase}.panel{border:1px solid var(--hairline);border-radius:14px;background:linear-gradient(160deg,var(--panel-2),var(--panel));box-shadow:0 10px 28px rgba(0,0,0,.15)}.countdown-panel{padding:1.25rem 1.3rem;margin-bottom:1rem}.label{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase}.clock{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.45rem;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:clamp(1.7rem,9vw,2.8rem);font-weight:700;letter-spacing:.02em}.clock .unit{color:var(--accent)}.clock small{display:block;margin-top:.15em;color:var(--muted);font-family:'Work Sans',sans-serif;font-size:.3em;font-weight:500;letter-spacing:.08em;text-transform:uppercase}.details{padding:1.25rem 1.3rem;margin-bottom:1rem}.mission{margin:.25rem 0 .85rem;font-family:'Barlow Condensed',sans-serif;font-size:clamp(1.55rem,6vw,2.1rem);font-weight:700;line-height:1.12}.detail-row{display:grid;grid-template-columns:82px minmax(0,1fr);gap:.75rem;padding:.55rem 0;border-top:1px solid rgba(201,195,224,.16)}.detail-row:first-of-type{border-top:0}.detail-key{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.7rem;text-transform:uppercase}.detail-value{color:var(--text);font-family:'Lora',serif;font-size:.98rem;line-height:1.45}.map-panel{padding:1.05rem}.map-title{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:0 0 .7rem;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:1rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}.map-note{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.62rem;text-align:right}.map-wrap{overflow:hidden;border:1px solid rgba(201,195,224,.22);border-radius:11px;background:#0d1530}.google-map{display:block;width:100%;height:390px;border:0;background:#0d1530}.map-empty{padding:1.3rem;color:var(--muted);font-family:'Lora',serif;line-height:1.55}.empty{padding:1.4rem;color:var(--muted);font-family:'Lora',serif;line-height:1.55}@media(max-width:520px){.page{padding-left:1rem;padding-right:1rem}.countdown-panel,.details{padding:1rem}.detail-row{grid-template-columns:70px minmax(0,1fr);gap:.55rem}.map-title{align-items:flex-start;flex-direction:column;gap:.25rem}.map-note{text-align:left}.google-map{height:330px}}
</style>
</head>
<body>
<main class="page">
  <div class="topbar"><a class="back" href="index.html" aria-label="Back to Watch-A-Launch">← Back</a></div>
  <h1>Next Tracked Launch</h1>
  <p class="subtitle">Watch-A-Launch</p>

  <section class="panel countdown-panel" aria-label="Countdown to next launch">
    <div class="label">Countdown to liftoff</div>
    <div class="clock" id="countdownClock">Loading…</div>
  </section>

  <section class="panel details" id="launchDetails" aria-live="polite">
    <div class="empty">Loading the next tracked launch…</div>
  </section>

  <section class="panel map-panel">
    <div class="map-title"><span>Launch Location</span><span class="map-note" id="mapLocationLabel">Loading…</span></div>
    <div class="map-wrap" id="mapWrap">
      <div class="map-empty">Loading Google Maps…</div>
    </div>
  </section>
</main>
<script>
const FEED_URL='launches.json';
let launchFeed=[];
let activeLaunch=null;
let countdownTimer=null;
let advanceQueued=false;

function parseDate(value){if(!value)return null;const date=new Date(value);return Number.isNaN(date.getTime())?null:date;}
function escapeHtml(value){return String(value??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}
function pad(number){return String(number).padStart(2,'0');}
function nextExactLaunch(){const now=new Date();return launchFeed.filter(launch=>{const date=parseDate(launch.launch_time_utc);return date&&date>now;}).sort((a,b)=>parseDate(a.launch_time_utc)-parseDate(b.launch_time_utc))[0]||null;}
function timeZoneForLaunch(launch){const site=String(launch.site||'').toLowerCase();if(site.includes('starbase')||site.includes('boca chica')||site.includes(', tx,'))return'America/Chicago';if(launch.location_code==='FL'||site.includes('cape canaveral')||site.includes('kennedy'))return'America/New_York';return'America/Los_Angeles';}
function formatLaunchTime(launch){const date=parseDate(launch.launch_time_utc);if(!date)return launch.time_description||'Exact launch time TBD';return new Intl.DateTimeFormat('en-US',{timeZone:timeZoneForLaunch(launch),weekday:'long',month:'long',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'}).format(date);}
function launchCoordinates(launch){const site=String(launch.site||'').toLowerCase();if(site.includes('vandenberg'))return{lat:34.742,lon:-120.572,label:'Vandenberg Space Force Base, California'};if(site.includes('cape canaveral')||site.includes('kennedy'))return{lat:28.4889,lon:-80.5778,label:'Cape Canaveral / Kennedy Space Center, Florida'};if(site.includes('starbase')||site.includes('boca chica')||site.includes(', tx,'))return{lat:25.997,lon:-97.156,label:'SpaceX Starbase, Texas'};if(launch.location_code==='CA')return{lat:34.742,lon:-120.572,label:'Vandenberg Space Force Base, California'};if(launch.location_code==='FL')return{lat:28.4889,lon:-80.5778,label:'Cape Canaveral / Kennedy Space Center, Florida'};return null;}
function formatClock(ms){if(ms<=0)return'<span class="unit">LIFTOFF WINDOW OPEN</span>';const total=Math.floor(ms/1000);const days=Math.floor(total/86400);const hours=Math.floor((total%86400)/3600);const mins=Math.floor((total%3600)/60);const secs=total%60;return`<span><span class="unit">${days}</span><small>days</small></span><span><span class="unit">${pad(hours)}</span><small>hrs</small></span><span><span class="unit">${pad(mins)}</span><small>min</small></span><span><span class="unit">${pad(secs)}</span><small>sec</small></span>`;}
function updateCountdown(){const clock=document.getElementById('countdownClock');if(!activeLaunch){clock.textContent='No exact launch time available';return;}const date=parseDate(activeLaunch.launch_time_utc);if(!date){clock.textContent='Exact time TBD';return;}const remaining=date-new Date();clock.innerHTML=formatClock(remaining);if(remaining<=0&&!advanceQueued){advanceQueued=true;setTimeout(()=>{advanceQueued=false;loadFeed();},2500);}}
function renderDetails(){const details=document.getElementById('launchDetails');if(!activeLaunch){details.innerHTML='<div class="empty">There is not currently an upcoming tracked launch with an exact liftoff time.</div>';return;}details.innerHTML=`<div class="label">Next launch</div><div class="mission">${escapeHtml(activeLaunch.rocket)} &middot; ${escapeHtml(activeLaunch.mission)}</div><div class="detail-row"><div class="detail-key">When</div><div class="detail-value">${escapeHtml(formatLaunchTime(activeLaunch))}</div></div><div class="detail-row"><div class="detail-key">Where</div><div class="detail-value">${escapeHtml(activeLaunch.site||'Launch site unavailable')}</div></div>`;}
function renderMap(){const wrap=document.getElementById('mapWrap');const label=document.getElementById('mapLocationLabel');if(!activeLaunch){label.textContent='Location unavailable';wrap.innerHTML='<div class="map-empty">No upcoming launch location is available.</div>';return;}const coords=launchCoordinates(activeLaunch);if(!coords){label.textContent=activeLaunch.site||'Location unavailable';wrap.innerHTML='<div class="map-empty">A Google Maps location could not be determined for this launch site.</div>';return;}label.textContent=coords.label;const query=encodeURIComponent(`${coords.lat},${coords.lon}`);const mapUrl=`https://www.google.com/maps?q=${query}&z=7&output=embed`;wrap.innerHTML=`<iframe class="google-map" title="Google Maps showing ${escapeHtml(coords.label)}" src="${mapUrl}" loading="eager" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>`;}
function renderPage(){activeLaunch=nextExactLaunch();renderDetails();renderMap();updateCountdown();if(countdownTimer)clearInterval(countdownTimer);countdownTimer=setInterval(updateCountdown,1000);}
function loadFeed(){fetch(`${FEED_URL}?t=${Date.now()}`,{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json();}).then(data=>{launchFeed=Array.isArray(data.launches)?data.launches:[];renderPage();}).catch(error=>{document.getElementById('launchDetails').innerHTML='<div class="empty">Could not load the next launch right now.</div>';document.getElementById('countdownClock').textContent='Unavailable';document.getElementById('mapWrap').innerHTML='<div class="map-empty">Google Maps could not be loaded because the launch data is unavailable.</div>';console.error(error);});}

loadFeed();
setInterval(loadFeed,60*60*1000);
</script>
</body>
</html>
